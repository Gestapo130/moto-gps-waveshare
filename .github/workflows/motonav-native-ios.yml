          base64 -D -i /tmp/motonav-native.b64 -o native-source.zip
          echo "0efbf138bc1b8920567205e0fc56bf0612e7735d9c3fa2c4facdb6f58d1ef948  native-source.zip" | shasum -a 256 --check
          unzip -q native-source.zip -d native
      - name: Install build tools and official AMap SDK dependencies
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate
          pod install --repo-update
      - name: Build independent iPhoneOS arm64 IPA
        working-directory: native
        run: bash scripts/build_ipa.sh
      - name: Run independent protocol, map, navigation and weather tests
        working-directory: native
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -workspace MotoNavNative.xcworkspace -scheme MotoNavNative             -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID"             -derivedDataPath build/simulator -resultBundlePath build/NativeTests.xcresult             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test > build/simulator-tests.log 2>&1 || {
              tail -n 180 build/simulator-tests.log; exit 1;
            }
          tail -n 35 build/simulator-tests.log
      - name: Export source used for the build
        run: cp native-source.zip native/build/export/MotoNav-Native-source-0.2.0.zip
      - name: Upload verified IPA and independent source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoNav-Native-iOS-unsigned
          path: native/build/export/*
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoNav-Native-build-logs
          path: |
            native/build/*.log
            native/build/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
