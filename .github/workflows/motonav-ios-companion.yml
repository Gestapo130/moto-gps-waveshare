          MOTONAV_OVERLAY
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          data = base64.b64decode(pathlib.Path('/tmp/motonav-overlay.b64').read_text())
          assert hashlib.sha256(data).hexdigest() == '775d6811dd55d8d7ed4f8c0ddf7e60865decacefbdab2e9348887784288fce03'
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  assert member.isfile() and target.is_relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          PY
      - name: Prepare Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec platforms/ios/project.yml
      - name: Select available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          iphones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if 'iPhone' in d['name']]
          assert iphones, 'No iPhone simulator'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + iphones[0]['udid'] + '\n')
          PY
      - name: Test original MotoNav wire bytes, Chinese bitmaps and existing navigation
        run: |
          set -o pipefail
          xcodebuild test -project platforms/ios/MotoGPS.xcodeproj -scheme MotoGPS \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build/motonav-tests -resultBundlePath build/MotoNavTests.xcresult \
            -only-testing:MotoGPSUnitTests CODE_SIGNING_ALLOWED=NO | tee motonav-ios-tests.log
      - name: Build and validate unsigned arm64 iPhone IPA
        run: |
          set -o pipefail
          bash scripts/ios/build_sideload_ipa.sh | tee motonav-ios-build.log
          mkdir -p delivery
          cp build/sideload/*.ipa delivery/MotoNav-Companion-0.1.0-1-unsigned.ipa
          cp motonav-ios-tests.log motonav-ios-build.log delivery/
          cp platforms/ios/App/Resources/MotoNav-* delivery/
          python3 - <<'PY'
          import json, pathlib, plistlib, zipfile
          path = pathlib.Path('delivery/MotoNav-Companion-0.1.0-1-unsigned.ipa')
          with zipfile.ZipFile(path) as archive:
              name = next(p for p in archive.namelist() if p.startswith('Payload/') and p.count('/') == 2 and p.endswith('.app/Info.plist'))
              info = plistlib.loads(archive.read(name))
              assert info['CFBundleIdentifier'] == 'org.example.motonavcompanion'
